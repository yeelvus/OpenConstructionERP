name: Release Signing (Sigstore / cosign)

on:
  # The release event is kept because it is the correct one, but on its own it
  # never arrives. release.yml creates the release with softprops/action-gh-release
  # authenticated by secrets.GITHUB_TOKEN, and GitHub does not start a workflow
  # from an event that a GITHUB_TOKEN produced. This workflow last ran on v8.0.0
  # for that reason, and everything released since then is unsigned.
  #
  # Desktop Release is the run that finishes last with assets attached, so its
  # completion is the point at which there is something to sign.
  release:
    types: [published]
  workflow_run:
    workflows: ["Desktop Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to sign"
        required: true
      backfill:
        description: "Signing an older release. Skips the SBOM, see below."
        type: boolean
        default: false
        required: false

permissions:
  contents: write
  id-token: write

jobs:
  resolve:
    name: Resolve the tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Two ways a Desktop Release completion is not something to sign. It also
    # runs from workflow_dispatch against a branch, where head_branch is a
    # branch name and there is no release behind it. And `types: [completed]`
    # includes a failed run: if one platform fails, the release is short an
    # installer, and the asset-count check below cannot tell, because it
    # compares the download against the release rather than the release against
    # the platforms it should have. Signing that produces a manifest which
    # verifies cleanly over an incomplete release, which reads as a complete
    # one. The recovery is to re-run Desktop Release, not this workflow.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "tag=${{ github.event.workflow_run.head_branch }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

  # The licence inventory used to hang off the same dead release event as this
  # workflow and stopped publishing on the same day. It is a job here rather
  # than a workflow of its own so the order is decided by the graph: it attaches
  # its three files first, then they get checksummed with everything else. Two
  # workflows racing on one trigger would have produced a manifest describing
  # some of the release, which reads exactly like a manifest describing all of it.
  # Skipped on a backfill, and the reason is not cost. A backfill signs a release
  # that was published weeks ago, and the SBOM is generated now, from whatever
  # the dependency ranges resolve to today. Attaching it would put a component
  # list on an old release page describing software that release never
  # contained, and then the manifest would cover that list, so the signature
  # would attest to it. The failure is not that the SBOM is missing; it is that
  # a signed one would be wrong, and wrong under a signature is the worst
  # version. A backfill therefore covers exactly the bytes that were published
  # at the time and nothing minted on the day it runs.
  #
  # This is deliberately a skip rather than a job left to fail. Both leave the
  # release without an SBOM, but only one of them says that was the intention.
  sbom:
    name: SBOM and licences
    needs: resolve
    if: ${{ !inputs.backfill }}
    permissions:
      contents: write
    uses: ./.github/workflows/sbom-and-licenses.yml
    with:
      tag: ${{ needs.resolve.outputs.tag }}

  sign:
    name: Sign release artefacts
    needs: [resolve, sbom]
    # Signing proceeds even when the inventory job fails. A manifest over the
    # installers alone is what every release since v8.0.0 would have had, and
    # withholding signatures because a licence list broke helps nobody. The run
    # still goes red, so the failure is not hidden.
    #
    # It has to survive `sbom` being skipped as well as failing, which is the
    # backfill path and is a different upstream state reaching the same
    # condition. A dependant of a skipped job is skipped too, unless its own
    # `if` is a status expression, which this is. That is the documented
    # behaviour and it is not restated here as a fact, because if it is ever
    # wrong this job silently does not run. The `confirm` job below settles it
    # by observation instead.
    if: ${{ !cancelled() && needs.resolve.result == 'success' }}
    runs-on: ubuntu-latest
    # Observed at 2.8 and 0.6 minutes, the difference being how much of the
    # 2.6 GB of installers the runner had to pull. This is a backstop against
    # inheriting the six hour default, not a ceiling sized from a distribution:
    # two samples do not make one, and the download only grows as platforms are
    # added. It is far enough above both readings that it cannot fire on a
    # healthy run.
    timeout-minutes: 60
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: "v2.4.1"

      - name: Download release artefacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          mkdir -p release-assets
          cd release-assets
          gh release download "$TAG" --repo "${{ github.repository }}" --skip-existing
          # A manifest built from some of the assets is worse than none, because
          # it reads as a complete one. Count what the release says it holds.
          expected=$(gh release view "$TAG" --repo "${{ github.repository }}" --json assets --jq '.assets | length')
          actual=$(ls -1 | wc -l)
          echo "release lists $expected assets, downloaded $actual"
          if [ "$expected" -ne "$actual" ]; then
            echo "Downloaded $actual of $expected assets, refusing to checksum a partial set." >&2
            exit 1
          fi
          ls -la

      - name: Produce SHA-256 checksums
        working-directory: release-assets
        run: |
          # A second run downloads the previous manifest and its signature along
          # with the real assets, and the glob below would hash those into the
          # new manifest, which would then describe its own history rather than
          # the release.
          rm -f SHA256SUMS SHA256SUMS.sig SHA256SUMS.pem
          if [ -z "$(ls -A . 2>/dev/null)" ]; then
            echo "No release assets to checksum, so nothing would be signed." >&2
            exit 1
          fi
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Sign the checksums file (keyless, OIDC)
        working-directory: release-assets
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          if [ ! -f SHA256SUMS ]; then
            echo "No SHA256SUMS to sign." >&2
            exit 1
          fi
          cosign sign-blob --yes \
            --output-signature SHA256SUMS.sig \
            --output-certificate SHA256SUMS.pem \
            SHA256SUMS

      # No event filter here. This step used to run only for the release event,
      # which is the one event that cannot reach this workflow, so every other
      # path produced a signature and then discarded it: a green run that
      # published nothing.
      - name: Upload checksums and signature to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        working-directory: release-assets
        run: |
          # All three or none. Uploading two of them and staying green is the
          # same failure this workflow already had once, wearing a smaller hat:
          # a signature without its certificate verifies for nobody.
          for f in SHA256SUMS SHA256SUMS.sig SHA256SUMS.pem; do
            if [ ! -f "$f" ]; then
              echo "$f is missing, refusing to publish a partial signature." >&2
              exit 1
            fi
          done
          for f in SHA256SUMS SHA256SUMS.sig SHA256SUMS.pem; do
            gh release upload "$TAG" "$f" --repo "${{ github.repository }}" --clobber
          done

      # A backfilled release ends up looking odd on purpose: signed, but with no
      # SBOM beside the signature, while its neighbours have both. Without a
      # record of why, that reads as a broken run rather than a decision, and
      # the obvious repair is to attach an SBOM generated today, which is
      # exactly the thing the skip exists to prevent. So the run says what it
      # was, on the page where someone checking would look.
      - name: State what this run signed
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          BACKFILL: ${{ inputs.backfill }}
          SBOM_RESULT: ${{ needs.sbom.result }}
        run: |
          {
            if [ "${BACKFILL}" = "true" ]; then
              echo "### Backfilled the signature on \`${TAG}\`"
              echo
              echo "The manifest covers the assets already published on that release, which are"
              echo "the bytes people have been downloading. Nothing was rebuilt: this job has no"
              echo "\`actions/checkout\`, so it has no source tree to rebuild from."
              echo
              echo "**No SBOM was attached, and that is deliberate.** Generating one now would"
              echo "describe today's dependency resolution, not what this release shipped with,"
              echo "and the manifest would then cover that description and sign it. An absent"
              echo "component list is better than a signed and wrong one. Do not repair this by"
              echo "running the SBOM job against this tag."
            else
              echo "### Signed \`${TAG}\`"
              echo
              echo "SBOM job: ${SBOM_RESULT:-not run}."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verification snippet (for the release notes)
        working-directory: release-assets
        run: |
          cat <<'EOF'
          To verify this release:

            cosign verify-blob \
              --certificate SHA256SUMS.pem \
              --signature SHA256SUMS.sig \
              --certificate-identity-regexp 'https://github.com/datadrivenconstruction/OpenConstructionERP/.*' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              SHA256SUMS

            sha256sum -c SHA256SUMS

          EOF

  # Whether a signature reached the release is a fact about the release, not
  # about this run, so it is read back off the release rather than inferred
  # from the jobs above. Every guard before this one is an argument about what
  # should happen; this is the only one that looks.
  #
  # The failure it exists for is the one this workflow has already had once, in
  # the form described above the upload step: a run where every job is green
  # and nothing was published. It can be reached again from any wiring change
  # that stops `sign` from starting, because a job that never starts reports no
  # failure. Skip propagation from `sbom` on a backfill is the specific way in,
  # and the reasoning that says it cannot happen is exactly the reasoning that
  # would be wrong. Reading the assets does not depend on that reasoning being
  # right.
  confirm:
    name: Confirm the release carries a signature
    needs: [resolve, sign]
    if: ${{ always() && needs.resolve.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read the three files back off the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          SIGN_RESULT: ${{ needs.sign.result }}
        run: |
          # Bounded retry against read-after-write lag on the assets API, not
          # against a missing upload. Three misses over twenty seconds is not a
          # slow API, it is an absent file.
          for attempt in 1 2 3; do
            if assets=$(gh release view "$TAG" --repo "${{ github.repository }}" \
                 --json assets --jq '.assets[].name' 2>fetch.err); then
              fetch_error=""
            else
              fetch_error=$(tr '\n' ' ' < fetch.err)
              assets=""
            fi
            missing=""
            for f in SHA256SUMS SHA256SUMS.sig SHA256SUMS.pem; do
              if ! printf '%s\n' "$assets" | grep -qxF "$f"; then
                missing="$missing $f"
              fi
            done
            if [ -z "$missing" ]; then break; fi
            if [ "$attempt" != 3 ]; then sleep 10; fi
          done

          # A release that could not be read is not a release without a
          # signature. Both end this job red, because neither confirms
          # anything, but they are different problems and saying "unsigned"
          # for the first one would be a guess wearing the clothes of a
          # measurement.
          if [ -n "$fetch_error" ]; then
            echo "::error::Could not read the assets on ${TAG}, so this run cannot say whether it is signed: ${fetch_error}"
            {
              echo "### \`${TAG}\`: not measured"
              echo
              echo "Reading the release failed, so this run makes no claim either way."
              echo "It is not evidence the release is unsigned."
              echo
              echo "\`\`\`"
              echo "${fetch_error}"
              echo "\`\`\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [ -n "$missing" ]; then
            echo "::error::${TAG} is missing:${missing}. The signing job reported '${SIGN_RESULT}'."
            {
              echo "### \`${TAG}\` was not signed by this run"
              echo
              echo "Missing from the release:${missing}"
              echo
              echo "The signing job reported \`${SIGN_RESULT}\`. If that reads \`skipped\` while"
              echo "the rest of the run is green, look at the job graph before looking at"
              echo "cosign: \`sign\` needs \`sbom\`, a backfill skips \`sbom\`, and a skipped"
              echo "dependency skips its dependants unless the \`if\` on \`sign\` overrides it."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "${TAG} carries SHA256SUMS, SHA256SUMS.sig and SHA256SUMS.pem."
